name: Update V2Ray Subscription

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      min-speed:
        description: 'Minimum speed in KB/s to keep a node'
        type: choice
        options:
          - '512'  # 512 KB/s
          - '1024' # 1 MB/s
          - '2048' # 2 MB/s
          - '4096' # 4 MB/s
          - '8192' # 8 MB/s
        required: false
        default: '4096'
      download-test-timeout:
        description: 'Download timeout in seconds'
        type: choice
        options:
          - '2'    # 2 seconds
          - '4'    # 4 seconds
          - '8'    # 8 seconds
        required: false
        default: '4'
      speed-test-timeout:
        description: 'Download speed test timeout in seconds'
        type: choice
        options:
          - '1000'  # 1000 seconds
          - '2000'  # 2000 seconds
          - '3000'  # 3000 seconds
          - '4000'  # 4000 seconds
          - '5000'  # 5000 seconds
        required: false
        default: '2000'

# Please keep usage of `env` to a minimum or avoid altogether.
# It's much better to be explicitly passing variables to steps/actions/scripts
# rather than using environmental variables that are available everywhere
# and you can't easily tell what they affect.
env: {}

# concurrency:
#   group: update-v2ray-subscription
#   cancel-in-progress: true

jobs:
  convert:
    name: Update V2Ray Subscription
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Sync fork with upstream
      run: |
        git remote -v
        git remote add upstream https://github.com/beck-8/subs-check.git
        git remote -v
        git fetch upstream
        git checkout master
        git rebase upstream/master -X theirs || true
        git push origin master --force-with-lease

    - name: Update config
      uses: mikefarah/yq@v4
      env:
        MIN_SPEED: ${{ inputs.min-speed }}
        DOWNLOAD_TEST_TIMEOUT: ${{ inputs.download-test-timeout }}
        SPEED_TEST_TIMEOUT: ${{ inputs.speed-test-timeout }}
      with:
        cmd: >
          yq -i '
            .min-speed = env(MIN_SPEED) |
            .download-timeout = env(DOWNLOAD_TEST_TIMEOUT) |
            .timeout = env(SPEED_TEST_TIMEOUT)
          ' ./config/config.example.yaml

    - name: Start Go program to generate all.yaml
      id: run_go_program
      run: |
        go run . -f ./config/config.example.yaml &
        echo $! > go.pid

    - name: Wait for proxies to be ready
      if: steps.run_go_program.outputs.status == 'success'
      run: |
        URL="http://127.0.0.1:8199/all.yaml"
        MAX_WAIT=3600   # 最多等 3600 秒
        INTERVAL=30    # 每隔 30 秒检查一次
        COUNT=0

        echo "Waiting for $URL to have content..."
        while true; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          if [ "$STATUS" = "200" ]; then
            # 获取文件内容长度
            SIZE=$(curl -s -L "$URL" | wc -c)
            if [ "$SIZE" -gt 0 ]; then
              echo "all.yaml is ready ($SIZE bytes)"
              curl -s -L "$URL" > all.yaml
              echo "Downloaded all.yaml"
              cat all.yaml
              break
            fi
          else
            echo "Waiting for $URL to return 200 OK, current status: $STATUS"
          fi

          COUNT=$((COUNT + INTERVAL))
          if [ "$COUNT" -ge "$MAX_WAIT" ]; then
            echo "Timeout waiting for all.yaml"
            exit 1
          fi

          sleep $INTERVAL
        done

    - name: Download and prepare subconverter
      run: |
        # Download subconverter
        wget https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
        tar -zxvf subconverter_linux64.tar.gz
        chmod +x subconverter/subconverter
        rm -fr subconverter_linux64.tar.gz

    - name: Run subconverter service
      id: run_subconverter_service
      run: |
        echo "Starting subconverter..."
        ./subconverter/subconverter &
        echo $! > subconverter.pid
        sleep 10  # 等待服务启动

        until curl -s http://127.0.0.1:25500 > /dev/null; do
          sleep 2
        done
        echo "subconverter ready"

    - name: Run subconverter API
      if: steps.run_subconverter_service.outputs.status == 'success'
      id: run_subconverter_api
      run: |
        # 检查是否有生成的订阅文件
        if [ ! -f sub.txt ]; then
          echo "sub.txt not found, exiting"
          exit 1
        fi

        # 调用 API 转换
        curl -v "http://127.0.0.1:25500/sub?target=v2ray&url=http://127.0.0.1:8199/all.yaml" -o sub.txt
        echo "Show subscription content:"
        echo "=== File info ==="
        ls -lh sub.txt
        wc -l sub.txt

        echo "=== First 500 chars ==="
        head -c 500 sub.txt
        echo

        echo "=== Hex preview ==="
        xxd -l 200 sub.txt

    - name: Cleanup background processes
      if: always()
      run: |
        # 杀掉后台进程
        [ -f go.pid ] && kill $(cat go.pid)
        [ -f subconverter.pid ] && kill $(cat subconverter.pid)

    - name: Base64 encode
      if: steps.run_subconverter_api.outputs.status == 'success'
      id: base64_encode
      run: |
        cat sub.txt | base64 -w 0 > sub.txt

    - name: Update subscription file
      if: steps.base64_encode.outputs.status == 'success'
      run: |
        # 更新订阅文件到仓库
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add sub.txt
        git commit -m "Update subscription file"
        git push origin master
